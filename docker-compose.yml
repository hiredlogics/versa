services:
  postgres:
    image: postgres:16-alpine
    container_name: leadpilot-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadpilot}
      POSTGRES_DB: ${POSTGRES_DB:-leadpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-leadpilot} -d ${POSTGRES_DB:-leadpilot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
